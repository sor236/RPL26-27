// ===================================================================
// ТУРНИРНАЯ ТАБЛИЦА
// ===================================================================
let scores = {};
function loadScores() {
    const saved = localStorage.getItem("rpl2026_scores");
    let parsed = saved ? JSON.parse(saved) : {};
    matchData.forEach(m => {
        if (m.homeScore !== null && m.awayScore !== null) {
            scores[m.id] = { home: m.homeScore, away: m.awayScore };
        } else if (parsed[m.id] !== undefined) {
            scores[m.id] = parsed[m.id];
        } else {
            scores[m.id] = null;
        }
    });
    localStorage.setItem("rpl2026_scores", JSON.stringify(scores));
}

function computeStandings() {
    const stats = {};
    teams.forEach(t => stats[t] = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, pts:0 });
    matchData.forEach(m => {
        const s = scores[m.id];
        if (s && s.home !== undefined && s.away !== undefined) {
            const hg = s.home, ag = s.away;
            stats[m.home].gf += hg; stats[m.home].ga += ag;
            stats[m.away].gf += ag; stats[m.away].ga += hg;
            stats[m.home].played++; stats[m.away].played++;
            if (hg > ag) { stats[m.home].wins++; stats[m.home].pts += 3; stats[m.away].losses++; }
            else if (hg < ag) { stats[m.away].wins++; stats[m.away].pts += 3; stats[m.home].losses++; }
            else { stats[m.home].draws++; stats[m.away].draws++; stats[m.home].pts++; stats[m.away].pts++; }
        }
    });
    return teams.map(name => ({ name, ...stats[name] })).sort((a,b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
}

function renderStandings() {
    const table = computeStandings();
    const container = document.getElementById('standingsContainer');
    let html = `<h3><i class="fas fa-table"></i> Турнирная таблица РПЛ 2026/2027</h3>
        <table><thead><tr><th>#</th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>З</th><th>П</th><th>О</th></tr></thead><tbody>`;
    table.forEach((t, idx) => {
        const teamId = teamIds[t.name];
        let nameHtml = t.name;
        const logoUrl = teamLogos[t.name] || '';
        const logoImg = logoUrl ? `<img src="${logoUrl}" alt="${t.name}" class="team-logo">` : '';
        if (teamId) {
            nameHtml = `<a href="https://www.championat.com/football/_russiapl/tournament/7096/teams/${teamId}/result/" target="_blank">${t.name}</a>`;
        }
        html += `<tr><td>${idx+1}</td><td class="team-name">${logoImg} ${nameHtml}</td>
            <td>${t.played}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td>
            <td>${t.gf}</td><td>${t.ga}</td><td><strong>${t.pts}</strong></td></tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

// ===================================================================
// ОПРЕДЕЛЕНИЕ ТУРОВ
// ===================================================================
function getLastPlayedTour() {
    let last = 1;
    matchData.forEach(m => {
        const s = scores[m.id];
        if (s && s.home !== undefined && s.away !== undefined && m.tour > last) {
            last = m.tour;
        }
    });
    return last;
}

function getTodayTour() {
    const now = new Date();
    now.setHours(0,0,0,0);
    for (let t = 1; t <= 30; t++) {
        const dates = tourDates[t];
        if (!dates || dates.length === 0) continue;
        const times = dates.map(ds => {
            const [d, m, y] = ds.split('.').map(Number);
            return new Date(y, m - 1, d).getTime();
        });
        const min = Math.min(...times);
        const max = Math.max(...times);
        if (now.getTime() >= min && now.getTime() <= max) {
            return t;
        }
    }
    return null;
}

function getDefaultTour() {
    return getTodayTour() || getLastPlayedTour();
}

// ===================================================================
// ОТОБРАЖЕНИЕ МАТЧЕЙ
// ===================================================================
function getActiveTour() {
    const activeBtn = document.querySelector('.bottom-btn.active');
    return activeBtn ? parseInt(activeBtn.getAttribute('data-tour')) : getDefaultTour();
}

function updateTeamColors() {
    const cards = document.querySelectorAll('.match-card');
    cards.forEach(card => {
        const id = parseInt(card.dataset.id);
        const s = scores[id];
        if (!s || s.home === undefined || s.away === undefined) return;
        const homeDiv = card.querySelector('.team:first-child');
        const awayDiv = card.querySelector('.team:last-child');
        if (!homeDiv || !awayDiv) return;
        homeDiv.classList.remove('win', 'loss', 'draw');
        awayDiv.classList.remove('win', 'loss', 'draw');
        if (s.home > s.away) { homeDiv.classList.add('win'); awayDiv.classList.add('loss'); }
        else if (s.home < s.away) { homeDiv.classList.add('loss'); awayDiv.classList.add('win'); }
        else { homeDiv.classList.add('draw'); awayDiv.classList.add('draw'); }
    });
}

function renderMatches() {
    const activeTour = getActiveTour();
    let filtered = matchData.filter(m => m.tour === activeTour);
    let html = '';
    for (let m of filtered) {
        const s = scores[m.id];
        const homeVal = s?.home !== undefined ? s.home : '';
        const awayVal = s?.away !== undefined ? s.away : '';
        const time = matchTimes[m.id] || '';
        const link = matchLinks[m.id] || '#';

        const homeLogo = teamLogos[m.home] || '';
        const awayLogo = teamLogos[m.away] || '';
        const homeLogoImg = homeLogo ? `<img src="${homeLogo}" alt="${m.home}" class="team-logo-small">` : '';
        const awayLogoImg = awayLogo ? `<img src="${awayLogo}" alt="${m.away}" class="team-logo-small">` : '';

        html += `
            <div class="match-card" data-id="${m.id}">
                <div class="card-header">
                    <span class="tour-badge">${m.tour}-й тур</span>
                    <span>${m.date} ${time ? time : ''}</span>
                    <a href="${link}" target="_blank" class="match-link"><i class="fas fa-external-link-alt"></i> Championat</a>
                </div>
                <div class="teams">
                    <div class="team">${homeLogoImg} ${m.home}</div>
                    <div class="vs">VS</div>
                    <div class="team">${m.away} ${awayLogoImg}</div>
                </div>
                <div class="score-inputs">
                    <input type="number" class="home-score" value="${homeVal}" placeholder="0" disabled>
                    <span>:</span>
                    <input type="number" class="away-score" value="${awayVal}" placeholder="0" disabled>
                </div>
            </div>
        `;
    }
    document.getElementById('matchesContainer').innerHTML = html;
    updateTeamColors();
    renderCalendar(activeTour);
}

// ===================================================================
// КАЛЕНДАРЬ
// ===================================================================
function renderCalendar(activeTour) {
    const grid = document.getElementById('calendarGrid');
    const label = document.getElementById('monthLabel');

    let month = 6;
    let year = 2026;
    if (tourDates[activeTour] && tourDates[activeTour].length > 0) {
        const [d, m, y] = tourDates[activeTour][0].split('.').map(Number);
        month = m - 1;
        year = y;
    }

    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    label.textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const tourDayMap = {};
    if (tourDates[activeTour]) {
        tourDates[activeTour].forEach(dateStr => {
            const [d, m, y] = dateStr.split('.').map(Number);
            if (m === month + 1 && y === year) {
                tourDayMap[d] = true;
            }
        });
    }

    let html = '';
    const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    dayNames.forEach(name => {
        html += `<div class="day-name">${name}</div>`;
    });

    const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
    for (let i = 0; i < startOffset; i++) {
        html += `<div class="day empty"></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
        let cls = 'day';
        if (tourDayMap[d]) {
            cls += ' tour-day active-tour';
        }
        html += `<div class="${cls}">${d}</div>`;
    }

    grid.innerHTML = html;
}

// Собираем даты туров для календаря
const tourDates = {};
matchData.forEach(m => {
    if (m.date) {
        if (!tourDates[m.tour]) tourDates[m.tour] = [];
        if (!tourDates[m.tour].includes(m.date)) tourDates[m.tour].push(m.date);
    }
});

// ===================================================================
// ФИЛЬТРЫ ПО ТУРАМ
// ===================================================================
function buildBottomFilters() {
    const container = document.getElementById('bottomPanel');
    const initialTour = getDefaultTour();
    let html = '';
    for (let i = 1; i <= 30; i++) {
        const cls = i === initialTour ? 'bottom-btn active' : 'bottom-btn';
        html += `<button class="${cls}" data-tour="${i}">${i} тур</button>`;
    }
    html += `<a href="https://sor236.github.io/WCF2026/table.html" target="_blank" class="bottom-link"><i class="fas fa-table"></i> Общая</a>`;
    container.innerHTML = html;
    container.querySelectorAll('.bottom-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            container.querySelectorAll('.bottom-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMatches();
        });
    });
}

// ===================================================================
// НАДПИСЬ В ШАПКЕ
// ===================================================================
function renderTourStatus() {
    const el = document.getElementById('tourStatus');
    if (!el) return;

    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    const todayStr = `${dd}.${mm}.${yyyy}`;

    const todayTour = getTodayTour();
    if (todayTour) {
        el.textContent = `Сегодня: ${todayStr}. Идёт ${todayTour} тур.`;
    } else {
        el.textContent = `Сегодня: ${todayStr}. Сыгран ${getLastPlayedTour()} тур.`;
    }
}

// ===================================================================
// ЗАПУСК
// ===================================================================
loadScores();
buildBottomFilters();
renderStandings();
renderMatches();
renderTourStatus();
